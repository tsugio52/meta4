<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pottery Smash VR: True Immersive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XRHandModelFactory.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; user-select: none; background-color: #040508; font-family: 'Inter', system-ui, sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
    .glass-card { background: rgba(14, 18, 27, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6); }
    #vr-overlay-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 50; text-align: center; }
  </style>
</head>
<body class="relative w-full h-full text-slate-100">
  <div id="canvas-container"></div>

  <div id="ui-layer" class="absolute inset-0 pointer-events-none z-20 transition-opacity duration-300">
    <div class="absolute top-4 left-1/2 -translate-x-1/2 glass-card px-6 py-2 rounded-full flex items-center space-x-3 pointer-events-auto">
      <div class="w-6 h-6 rounded-md bg-gradient-to-br from-amber-500 to-rose-600 flex items-center justify-center text-white text-sm"><i class="fa-solid fa-vr-cardboard"></i></div>
      <span class="text-sm font-black tracking-widest text-white">TRUE IMMERSIVE VR</span>
    </div>

    <button id="custom-vr-btn" class="absolute bottom-[220px] left-1/2 -translate-x-1/2 px-10 py-5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white font-black rounded-full shadow-[0_0_40px_rgba(249,115,22,0.8)] pointer-events-auto transform transition-all active:scale-95 text-3xl flex items-center gap-4 border-2 border-white/40 z-50">
      <i class="fa-solid fa-vr-cardboard text-4xl"></i> ENTER VR
    </button>

    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 glass-card px-6 py-4 rounded-2xl flex flex-col items-center pointer-events-auto max-w-sm w-full">
      <h3 class="text-amber-400 font-bold mb-2 text-sm"><i class="fa-solid fa-hands"></i> ハンドトラッキング＆VR操作ガイド</h3>
      <ul class="text-xs text-slate-300 space-y-1.5 w-full">
        <li><span class="inline-block w-6 text-center text-white bg-white/10 rounded mr-1">👆</span> <b>トリガー / ピンチ(つまむ):</b> 鉢を掴む・投げる</li>
        <li><span class="inline-block w-6 text-center text-white bg-white/10 rounded mr-1">✊</span> <b>右手グリップ / 握る:</b> 鉢の種類チェンジ</li>
        <li><span class="inline-block w-6 text-center text-white bg-white/10 rounded mr-1">✊</span> <b>左手グリップ / 握る:</b> 部屋の清掃＆タワー再建</li>
      </ul>
    </div>
  </div>

  <script>
    let scene, camera, renderer, clock;
    let readyPot = null;
    let flyingPots = [];
    let shards = [], towerBlocks = [], ambientParticles;
    
    let xrControllers = [], xrCameraSpace;
    let audioEnabled = true, audioCtx = null, activePotType = 'terracotta';

    const ARENA = { 
      wallZ: -8.0,      
      floorY: 0,        
      sideX: 6.0,       
      ceilY: 6.0,       
      readyPos: new THREE.Vector3(0, 0.85, -1.0) 
    };
    
    const GRAVITY = -9.8; 
    const POT_SCALE = 0.35; 
    const CRATE_SIZE = 0.4;

    function getAudioContext() { if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); } if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
    
    function playSound(type, intensity = 1.0) {
      if (!audioEnabled) return; const ctx = getAudioContext(); if (!ctx) return; const now = ctx.currentTime;
      if (type === 'impact') {
        const sub = ctx.createOscillator(), g = ctx.createGain(); sub.frequency.setValueAtTime(150, now); sub.frequency.exponentialRampToValueAtTime(30, now+0.2); g.gain.setValueAtTime(intensity, now); g.gain.exponentialRampToValueAtTime(0.01, now+0.2); sub.connect(g); g.connect(ctx.destination); sub.start(now); sub.stop(now+0.2);
        for(let i=0; i<4; i++) { setTimeout(() => { const cl = ctx.createOscillator(), cg = ctx.createGain(); cl.frequency.setValueAtTime(3000+Math.random()*4000, ctx.currentTime); cg.gain.setValueAtTime(0.2*intensity, ctx.currentTime); cg.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.05); cl.connect(cg); cg.connect(ctx.destination); cl.start(); cl.stop(ctx.currentTime+0.05); }, i*40); }
      } else if (type === 'whoosh') {
        const dur = 0.25, bufLen = Math.floor(ctx.sampleRate*dur), buf = ctx.createBuffer(1, bufLen, ctx.sampleRate), d = buf.getChannelData(0);
        for(let i=0; i<bufLen; i++) d[i] = (Math.random()*2-1)*Math.sin((i/bufLen)*Math.PI);
        const src = ctx.createBufferSource(); src.buffer = buf; const f = ctx.createBiquadFilter(), g = ctx.createGain();
        f.type = 'lowpass'; f.frequency.setValueAtTime(400, now); f.frequency.linearRampToValueAtTime(1200*intensity, now+0.1); g.gain.setValueAtTime(0.01, now); g.gain.linearRampToValueAtTime(0.5*intensity, now+0.1); g.gain.exponentialRampToValueAtTime(0.01, now+dur);
        src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(now);
      }
    }

    function triggerHaptics(controller, intensity = 1.0, durationMs = 100) {
      if (!controller.userData.inputSource) return;
      const gamepad = controller.userData.inputSource.gamepad;
      if (gamepad && gamepad.hapticActuators && gamepad.hapticActuators.length > 0) {
        gamepad.hapticActuators[0].pulse(intensity, durationMs);
      }
    }

    function createCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
    
    function texWall() { return new THREE.CanvasTexture(createCanvas(256, 256, (ctx, w, h) => { ctx.fillStyle='#3a3532'; ctx.fillRect(0,0,w,h); for(let i=0;i<3000;i++){ ctx.fillStyle=Math.random()>0.5?'rgba(0,0,0,0.1)':'rgba(255,255,255,0.03)'; ctx.fillRect(Math.random()*w,Math.random()*h,2,2); } })); }
    function texClay() { return new THREE.CanvasTexture(createCanvas(512, 512, (ctx, w, h) => { ctx.fillStyle='#a86a45'; ctx.fillRect(0,0,w,h); const img=ctx.getImageData(0,0,w,h), d=img.data; for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*25; d[i]=Math.min(255,Math.max(0,d[i]+n)); d[i+1]=Math.min(255,Math.max(0,d[i+1]+n*0.7)); d[i+2]=Math.min(255,Math.max(0,d[i+2]+n*0.4)); } ctx.putImageData(img,0,0); })); }
    function texSoil() { return new THREE.CanvasTexture(createCanvas(256, 256, (ctx, w, h) => { ctx.fillStyle='#1d120d'; ctx.fillRect(0,0,w,h); for(let i=0;i<1500;i++){ ctx.fillStyle=Math.random()>0.4?'rgba(65,42,28,0.75)':'rgba(8,6,4,0.9)'; ctx.beginPath(); ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2+0.5,0,Math.PI*2); ctx.fill(); } })); }
    function texMagma() { return new THREE.CanvasTexture(createCanvas(512, 512, (ctx, w, h) => { ctx.fillStyle='#181210'; ctx.fillRect(0,0,w,h); ctx.strokeStyle='#ff4400'; ctx.lineWidth=8; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=12; for(let i=0;i<12;i++){ ctx.beginPath(); let tx=Math.random()*w, ty=Math.random()*h; ctx.moveTo(tx,ty); for(let s=0;s<6;s++){ tx+=(Math.random()-0.5)*80; ty+=(Math.random()-0.5)*80; ctx.lineTo(tx,ty); } ctx.stroke(); } })); }
    function texCrate() { return new THREE.CanvasTexture(createCanvas(256, 256, (ctx, w, h) => { ctx.fillStyle='#8b5a2b'; ctx.fillRect(0,0,w,h); ctx.strokeStyle='#3e2410'; ctx.lineWidth=8; ctx.strokeRect(4,4,w-8,h-8); ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(w-4,h-4); ctx.moveTo(w-4,4); ctx.lineTo(4,h-4); ctx.stroke(); })); }
    
    function initScene() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene(); 
      scene.background = new THREE.Color(0x1a1817); 
      scene.fog = new THREE.FogExp2(0x1a1817, 0.025);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
      clock = new THREE.Clock();

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true; 
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      
      renderer.xr.enabled = true;
      setupCustomVRButton();

      xrCameraSpace = new THREE.Group();
      xrCameraSpace.position.set(0, 0, 0); 
      scene.add(xrCameraSpace);
      xrCameraSpace.add(camera);

      if(!renderer.xr.isPresenting) camera.position.set(0, 1.4, 2.0);

      container.appendChild(renderer.domElement);
      
      setupImmersiveEnvironment();
      setupLighting();
      buildTower();
      spawnReadyPot();

      window.addEventListener('resize', onResize);
      setupXRControllers();
      
      renderer.xr.addEventListener('sessionstart', () => {
        document.getElementById('ui-layer').style.opacity = '0';
      });
      renderer.xr.addEventListener('sessionend', () => {
        document.getElementById('ui-layer').style.opacity = '1';
        camera.position.set(0, 1.4, 2.0);
      });
    }

    function setupCustomVRButton() {
      const vrBtn = document.getElementById('custom-vr-btn');
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            vrBtn.addEventListener('click', async () => {
              try {
                const session = await navigator.xr.requestSession('immersive-vr', { 
                  optionalFeatures: ['local-floor', 'hand-tracking'] 
                });
                renderer.xr.setSession(session);
              } catch (e) {
                alert('VRの起動に失敗しました: ' + e.message);
              }
            });
          } else {
            vrBtn.innerHTML = 'VR非対応デバイス';
            vrBtn.classList.replace('from-orange-500', 'from-slate-600');
            vrBtn.classList.replace('to-amber-500', 'to-slate-500');
            vrBtn.disabled = true;
          }
        });
      } else {
        vrBtn.innerHTML = '<span class="text-lg">HTTPS接続が必要です</span>';
        vrBtn.classList.replace('from-orange-500', 'from-rose-700');
        vrBtn.classList.replace('to-amber-500', 'to-rose-600');
        vrBtn.style.boxShadow = "0 0 30px rgba(225, 29, 72, 0.8)";
        vrBtn.disabled = true;
      }
    }

    function setupImmersiveEnvironment() {
      const roomGeo = new THREE.BoxGeometry(ARENA.sideX * 2, ARENA.ceilY, Math.abs(ARENA.wallZ) + 4);
      const roomMat = new THREE.MeshStandardMaterial({ map: texWall(), roughness: 1.0, side: THREE.BackSide });
      const room = new THREE.Mesh(roomGeo, roomMat);
      room.position.set(0, ARENA.ceilY/2, ARENA.wallZ/2 + 2);
      scene.add(room);

      // 💡 マットな単色の床に変更（チカチカする原因となるテクスチャを排除）
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d3530, roughness: 1.0, metalness: 0.0 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = ARENA.floorY;
      floor.receiveShadow = true;
      scene.add(floor);

      const pedH = ARENA.readyPos.y;
      const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, pedH, 16), new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 }));
      pedestal.position.set(ARENA.readyPos.x, ARENA.floorY + pedH/2, ARENA.readyPos.z);
      pedestal.castShadow = true; pedestal.receiveShadow = true;
      scene.add(pedestal);

      ambientParticles = null;
    }

    function setupLighting() {
      scene.add(new THREE.AmbientLight(0xffe6cc, 0.3));
      const mainSpot = new THREE.SpotLight(0xffd6aa, 1.2); 
      mainSpot.position.set(0, 5.8, 0); mainSpot.target.position.set(0, 0, ARENA.wallZ/2);
      mainSpot.angle = Math.PI/2.5; mainSpot.penumbra = 0.7; mainSpot.castShadow = true;
      scene.add(mainSpot); scene.add(mainSpot.target);
      
      const rim = new THREE.PointLight(0x5577aa, 0.6, 15); rim.position.set(-3, 3, -2); scene.add(rim);
    }

    function setupXRControllers() {
      let handModelFactory = null;
      if (typeof THREE.XRHandModelFactory !== 'undefined') {
        handModelFactory = new THREE.XRHandModelFactory();
      }

      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        xrCameraSpace.add(controller);
        
        const handGroup = new THREE.Group();
        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.1), new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8, roughness: 0.2}));
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 16), new THREE.MeshStandardMaterial({color: i===0?0xff3333:0x3388ff, emissive: i===0?0xff3333:0x3388ff, emissiveIntensity: 0.8}));
        core.position.z = -0.02;
        handGroup.add(palm); handGroup.add(core);
        controller.add(handGroup);
        
        controller.userData.velocity = new THREE.Vector3(); 
        controller.userData.prevPositions = [];

        controller.addEventListener('connected', function(e) { 
          this.userData.inputSource = e.data; 
          if (e.data.hand) {
            handGroup.visible = false;
          } else {
            handGroup.visible = true;
          }
        });

        const hand = renderer.xr.getHand(i);
        if (handModelFactory) {
          const handModel = handModelFactory.createHandModel(hand, "spheres");
          hand.add(handModel);
        }
        xrCameraSpace.add(hand);

        controller.addEventListener('selectstart', (e) => {
          const ctrl = e.target;
          if (readyPot && !readyPot.isGrabbed) {
            const ctrlPos = new THREE.Vector3(); ctrl.getWorldPosition(ctrlPos);
            const potPos = new THREE.Vector3(); readyPot.mesh.getWorldPosition(potPos);
            
            // 💡 掴む判定の距離を少し広げて、掴みやすくしました（0.4 -> 0.5）
            if (ctrlPos.distanceTo(potPos) < 0.5) {
              readyPot.isGrabbed = true; ctrl.userData.grabbedPot = readyPot;
              ctrl.attach(readyPot.mesh);
              triggerHaptics(ctrl, 0.5, 30);
            }
          }
        });

        controller.addEventListener('selectend', (e) => {
          const ctrl = e.target;
          if (ctrl.userData.grabbedPot) {
            const pot = ctrl.userData.grabbedPot; pot.isGrabbed = false; ctrl.userData.grabbedPot = null;
            scene.attach(pot.mesh);
            
            // 💡 投げる力の倍率を上げ（2.0 -> 3.0）、速度が遅いと下に落ちる原因となっていたしきい値を削除しました
            const vel = ctrl.userData.velocity.clone().multiplyScalar(3.0); 
            
            flyingPots.push({ mesh: pot.mesh, bodyMat: pot.bodyMat, soilMat: pot.soilMat, leafMat: pot.leafMat, type: pot.type, vel: vel, angVel: new THREE.Vector3((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15) });
            readyPot = null;
            
            triggerHaptics(ctrl, Math.min(vel.length()/15, 1.0), 60);
            playSound('whoosh', vel.length()/10);
            setTimeout(spawnReadyPot, 600);
          }
        });

        controller.addEventListener('squeezestart', (e) => {
          const ctrl = e.target; 
          if (i === 1) { 
            const types = ['terracotta', 'dynamite', 'crystal'];
            activePotType = types[(types.indexOf(activePotType)+1)%types.length];
            if(readyPot) { scene.remove(readyPot.mesh); readyPot = null; }
            spawnReadyPot();
            triggerHaptics(ctrl, 0.3, 20);
          } else { 
            clearRoom();
            triggerHaptics(ctrl, 0.8, 150);
          }
        });
        xrControllers.push(controller);
      }
    }

    function trackControllerVelocities() {
      xrControllers.forEach(c => {
        const pos = new THREE.Vector3(); c.getWorldPosition(pos);
        c.userData.prevPositions.push({ pos: pos.clone(), time: performance.now() });
        // 💡 速度計算のサンプルフレームを少し増やして（5 -> 8）、手の軌跡のブレを吸収します
        if (c.userData.prevPositions.length > 8) c.userData.prevPositions.shift();
        if (c.userData.prevPositions.length >= 2) {
          const dt = (c.userData.prevPositions[c.userData.prevPositions.length-1].time - c.userData.prevPositions[0].time) / 1000;
          if (dt > 0) c.userData.velocity.copy(c.userData.prevPositions[c.userData.prevPositions.length-1].pos).sub(c.userData.prevPositions[0].pos).divideScalar(dt);
        }
      });
    }

    function buildPotModel(type) {
      const group = new THREE.Group();
      let color = 0xffffff, emissive = 0x000000, roughness = 0.9, metalness = 0.02, map = null, transparent = false, opacity = 1.0, emissiveInt = 1.0;
      
      if(type === 'dynamite') { color = 0xd91e18; emissive = 0x550505; roughness = 0.35; metalness = 0.2; }
      else if(type === 'crystal') { color = 0x88e7ff; roughness = 0.06; metalness = 0.1; transparent = true; opacity = 0.82; }
      else if(type === 'magma') { map = texMagma(); roughness = 0.7; emissive = 0xff3300; emissiveInt = 0.55; }
      else { map = texClay(); }

      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, map, transparent, opacity });
      if(type === 'magma') bodyMat.emissiveIntensity = emissiveInt;
      
      const pts = []; const h = 1.0, bR = 0.42, tR = 0.62, rimR = 0.68;
      pts.push(new THREE.Vector2(bR * 0.8, 0.0), new THREE.Vector2(bR, 0.05), new THREE.Vector2(bR * 1.05, 0.3));
      pts.push(new THREE.Vector2(tR * 0.96, h * 0.86), new THREE.Vector2(rimR, h * 0.92), new THREE.Vector2(rimR, h));
      pts.push(new THREE.Vector2(rimR * 0.91, h), new THREE.Vector2(tR * 0.85, h * 0.86), new THREE.Vector2(bR * 0.75, 0.12), new THREE.Vector2(0.12, 0.1));
      const bodyMesh = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), bodyMat);
      bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
      group.add(bodyMesh);

      if (type === 'dynamite') {
        const fuseCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, h*0.9, 0), new THREE.Vector3(0.05, h*1.15, 0.03), new THREE.Vector3(-0.02, h*1.32, 0.08)]);
        const fuseMesh = new THREE.Mesh(new THREE.TubeGeometry(fuseCurve, 8, 0.02, 6, false), new THREE.MeshBasicMaterial({ color: 0x332211 }));
        const sparkMesh = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffdd44 }));
        sparkMesh.position.set(-0.02, h*1.32, 0.08);
        group.add(fuseMesh); group.add(sparkMesh);
      }

      const soilMat = new THREE.MeshStandardMaterial({ map: texSoil(), roughness: 0.96 });
      const soilMesh = new THREE.Mesh(new THREE.CylinderGeometry(tR*0.85, tR*0.76, 0.22, 24), soilMat);
      soilMesh.position.y = h * 0.82; soilMesh.castShadow = true;
      group.add(soilMesh);

      let leafColor = 0x2ea048;
      if (type === 'dynamite') leafColor = 0x772211; else if (type === 'crystal') leafColor = 0x44ddee; else if (type === 'magma') leafColor = 0xff6600;
      const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: type==='crystal'?0.1:0.35, side: THREE.DoubleSide });
      const plantGroup = new THREE.Group(); plantGroup.position.y = h * 0.86;
      const leafCount = type==='dynamite'?5:10;
      for (let i = 0; i < leafCount; i++) {
        const ang = (i / leafCount) * Math.PI * 2 + Math.random() * 0.3;
        const stemCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0), new THREE.Vector3(Math.cos(ang)*0.28, 0.38+Math.random()*0.2, Math.sin(ang)*0.28), new THREE.Vector3(Math.cos(ang)*0.58, 0.54+Math.random()*0.25, Math.sin(ang)*0.58)]);
        const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 8, 0.025, 5, false), new THREE.MeshStandardMaterial({ color: 0x1b4d24 }));
        const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.65), leafMat);
        leaf.position.copy(stemCurve.getPoint(1.0));
        leaf.rotation.set(0.45+Math.random()*0.25, ang-Math.PI/2, (Math.random()-0.5)*0.4);
        plantGroup.add(stem); plantGroup.add(leaf);
      }
      group.add(plantGroup);

      return { mesh: group, bodyMat, soilMat, leafMat, type };
    }

    function spawnReadyPot() {
      if(readyPot) return;
      const model = buildPotModel(activePotType);
      model.mesh.scale.set(POT_SCALE, POT_SCALE, POT_SCALE);
      model.mesh.position.copy(ARENA.readyPos);
      scene.add(model.mesh);
      readyPot = { 
        mesh: model.mesh, 
        bodyMat: model.bodyMat, 
        soilMat: model.soilMat, 
        leafMat: model.leafMat, 
        type: model.type, 
        isGrabbed: false 
      };
    }

    function buildTower() {
      towerBlocks.forEach(b => scene.remove(b.mesh)); towerBlocks = [];
      const cMat = new THREE.MeshStandardMaterial({ map: texCrate(), roughness: 0.8 });
      const levels = 4, startY = ARENA.floorY + CRATE_SIZE/2, baseZ = ARENA.wallZ + 1.5;
      for(let l=0; l<levels; l++){
        const count = levels - l, startX = -(count*CRATE_SIZE)/2 + CRATE_SIZE/2, yPos = startY + l*CRATE_SIZE;
        for(let c=0; c<count; c++){
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(CRATE_SIZE, CRATE_SIZE, CRATE_SIZE), cMat);
          mesh.position.set(startX + c*CRATE_SIZE, yPos, baseZ);
          mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
          towerBlocks.push({ mesh, radius: CRATE_SIZE*0.5, vel: new THREE.Vector3(0,0,0), angVel: new THREE.Vector3(0,0,0), isResting: false });
        }
      }
    }

    function clearRoom() {
      shards.forEach(s => scene.remove(s.mesh)); shards = [];
      buildTower();
    }

    function shatterPot(fp) {
      scene.remove(fp.mesh);
      playSound('impact', fp.vel.length()/10);
      
      if(fp.type === 'dynamite') xrControllers.forEach(c => triggerHaptics(c, 1.0, 300));
      else if(fp.type === 'crystal') xrControllers.forEach(c => triggerHaptics(c, 0.4, 100));

      const impactPos = fp.mesh.position;
      const shardCount = fp.type==='crystal' ? 60 : 30; 
      
      for(let i=0; i<shardCount; i++){
        const sSize = (0.05 + Math.random()*0.05) * (fp.type==='crystal'?0.5:1.0);
        const sm = new THREE.Mesh(new THREE.TetrahedronGeometry(sSize), fp.bodyMat);
        sm.scale.set(1.2 + Math.random(), 0.15, 1.0 + Math.random());
        sm.position.copy(impactPos).add(new THREE.Vector3((Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3, 0));
        const ang = Math.random()*Math.PI*2, force = (Math.random()*0.5+0.5) * fp.vel.length() * (fp.type==='dynamite'?1.5:0.5);
        shards.push({ mesh: sm, vel: new THREE.Vector3(Math.cos(ang)*force+fp.vel.x*0.2, Math.sin(ang)*force+Math.random()*3, Math.abs(fp.vel.z)*0.3), angVel: new THREE.Vector3((Math.random()-0.5)*20, (Math.random()-0.5)*20, 0), radius: sSize, isResting: false });
        scene.add(sm);
      }
      
      for(let i=0; i<10; i++){
        const sSize = i===0 ? 0.15 : 0.03 + Math.random()*0.03; 
        const sm = new THREE.Mesh(new THREE.DodecahedronGeometry(sSize, 0), fp.soilMat);
        sm.position.copy(impactPos).add(new THREE.Vector3((Math.random()-0.5)*0.2, 0.1, (Math.random()-0.5)*0.2));
        const force = (Math.random()*0.4+0.2) * fp.vel.length();
        shards.push({ mesh: sm, vel: new THREE.Vector3((Math.random()-0.5)*force+fp.vel.x*0.1, Math.random()*2+1, Math.abs(fp.vel.z)*0.2), angVel: new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10, 0), radius: sSize, isResting: false });
        scene.add(sm);
      }

      const foliageCount = fp.type==='dynamite'?3:6;
      for(let i=0; i<foliageCount; i++){
        const sm = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.2), fp.leafMat);
        sm.position.copy(impactPos).add(new THREE.Vector3((Math.random()-0.5)*0.4, 0.2, (Math.random()-0.5)*0.4));
        shards.push({ mesh: sm, vel: new THREE.Vector3((Math.random()-0.5)*3, Math.random()*3+1, Math.abs(fp.vel.z)*0.1), angVel: new THREE.Vector3((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15), radius: 0.05, isResting: false });
        scene.add(sm);
      }
    }

    function stepPhysics(dt) {
      if(ambientParticles) ambientParticles.rotation.y += dt * 0.05;

      for(let i=flyingPots.length-1; i>=0; i--){
        const fp = flyingPots[i];
        fp.vel.y += GRAVITY * dt;
        fp.mesh.position.addScaledVector(fp.vel, dt);
        fp.mesh.rotation.x += fp.angVel.x * dt; fp.mesh.rotation.y += fp.angVel.y * dt;
        
        let hit = false;
        for(let tb of towerBlocks){
          if(fp.mesh.position.distanceTo(tb.mesh.position) < tb.radius + POT_SCALE*0.5) {
            tb.isResting = false; tb.vel.copy(fp.vel).multiplyScalar(0.5).add(new THREE.Vector3(0, 2, 0));
            tb.angVel.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
            hit = true; break;
          }
        }
        if(hit || fp.mesh.position.z <= ARENA.wallZ || fp.mesh.position.y <= ARENA.floorY+0.1 || Math.abs(fp.mesh.position.x) > ARENA.sideX){
          shatterPot(fp); flyingPots.splice(i,1);
        }
      }

      for(let tb of towerBlocks){
        if(tb.isResting) continue;
        tb.vel.y += GRAVITY * dt; tb.mesh.position.addScaledVector(tb.vel, dt);
        tb.mesh.rotation.x += tb.angVel.x * dt; tb.mesh.rotation.y += tb.angVel.y * dt;
        if(tb.mesh.position.y <= ARENA.floorY + CRATE_SIZE/2){
          tb.mesh.position.y = ARENA.floorY + CRATE_SIZE/2; tb.vel.y *= -0.3; tb.vel.x *= 0.8; tb.vel.z *= 0.8; tb.angVel.multiplyScalar(0.8);
          if(tb.vel.lengthSq() < 0.1) tb.isResting = true;
        }
      }

      for(let s of shards){
        if(s.isResting) continue;
        s.vel.y += GRAVITY * dt; s.mesh.position.addScaledVector(s.vel, dt);
        s.mesh.rotation.x += s.angVel.x * dt; s.mesh.rotation.y += s.angVel.y * dt;
        if(s.mesh.position.y <= ARENA.floorY + s.radius){
          s.mesh.position.y = ARENA.floorY + s.radius; s.vel.y *= -0.3; s.vel.x *= 0.8; s.vel.z *= 0.8;
          if(s.vel.lengthSq() < 0.1) s.isResting = true;
        }
      }
    }

    function onResize() {
      if (renderer.xr.isPresenting) return;
      const c = document.getElementById('canvas-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    function animateFrame() {
      const dt = Math.min(clock.getDelta(), 0.1);
      if(renderer.xr.isPresenting) trackControllerVelocities();
      stepPhysics(dt);
      renderer.render(scene, camera);
    }

    window.onload = function() {
      initScene();
      renderer.setAnimationLoop(animateFrame);
    };
  </script>
</body>
</html>
